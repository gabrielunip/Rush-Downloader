name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source

      - name: Corrigir Compatibilidade Java no app/build.gradle.kts
        run: |
          BUILD_FILE=$(find source -name "build.gradle.kts" -path "*/app/*" -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            echo "A atualizar o Java para a versão 17 no ficheiro: $BUILD_FILE"
            
            # Cria um ficheiro temporário para reescrever o bloco compileOptions com Java 17
            python3 -c "
            path = '$BUILD_FILE'
            with open(path, 'r') as f:
                content = f.read()
            
            # Substitui ou injeta o sourceCompatibility e targetCompatibility para JavaVersion.VERSION_17
            if 'compileOptions {' in content:
                # Se já existir compileOptions, substitui o conteúdo interno
                old_block = 'compileOptions {'
                new_block = '''compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17'''
                content = content.replace(old_block, new_block, 1)
            else:
                # Se não existir, adiciona dentro do bloco android
                content = content.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }')
            
            with open(path, 'w') as f:
                f.write(content)
            "
          fi

      - name: Configurar Gradle (Automático)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (Debug)
        run: |
          PROJECT_DIR=$(dirname $(find source -name "settings.gradle.kts" -print -quit))
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
