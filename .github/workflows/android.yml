name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source

      - name: Configurar Gradle (Automático)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (Debug)
        run: |
          # Encontra a pasta interna onde está o build.gradle.kts ou settings.gradle.kts extraído
          PROJECT_DIR=$(dirname $(find source -name "settings.gradle.kts" -print -quit))
          cd "$PROJECT_DIR"
          
          # Compila o APK usando o gradle instalado globalmente pela action
          gradle assembleDebug

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
