name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir source
          unzip BlueRushDownloader_project.zip -d source

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: source
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
