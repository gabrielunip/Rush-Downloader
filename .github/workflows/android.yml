name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source

      - name: Forçar Java 17 e Injetar Imports Necessários
        run: |
          # 1. Adiciona o import do verticalScroll no MainActivity.kt
          MAIN_FILE=$(find source -name "MainActivity.kt" -print -quit)
          if [ -n "$MAIN_FILE" ]; then
            echo "A adicionar o import no: $MAIN_FILE"
            sed -i '0,/package /{s/package \(.*\)/package \1\n\nimport androidx.compose.foundation.verticalScroll/}' "$MAIN_FILE"
          fi

          # 2. Força o Java 17 no build.gradle.kts do app para evitar conflitos de JVM
          BUILD_FILE=$(find source -name "build.gradle.kts" -path "*/app/*" -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            echo "A injetar a configuração Java 17 em: $BUILD_FILE"
            echo "" >> "$BUILD_FILE"
            echo "android {" >> "$BUILD_FILE"
            echo "    compileOptions {" >> "$BUILD_FILE"
            echo "        sourceCompatibility = JavaVersion.VERSION_17" >> "$BUILD_FILE"
            echo "        targetCompatibility = JavaVersion.VERSION_17" >> "$BUILD_FILE"
            echo "    }" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
            echo "kotlin {" >> "$BUILD_FILE"
            echo "    compilerOptions {" >> "$BUILD_FILE"
            echo "        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17" >> "$BUILD_FILE"
            echo "    }" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
          fi

      - name: Configurar Gradle (Automático)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (Debug)
        run: |
          PROJECT_DIR=$(dirname $(find source -name "settings.gradle.kts" -print -quit))
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
