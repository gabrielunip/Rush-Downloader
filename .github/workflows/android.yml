name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source
          # Lista o conteúdo para sabermos onde o gradlew foi parar se falhar de novo
          ls -R source

      - name: Encontrar e dar permissão ao Gradle Wrapper
        run: |
          # Procura o gradlew em qualquer subpasta dentro de source e dá permissão
          find source -name "gradlew" -exec chmod +x {} \;

      - name: Compilar APK (Debug)
        run: |
          # Encontra a pasta onde está o gradlew e roda a compilação de lá
          GRADLEW_PATH=$(find source -name "gradlew" -print -quit)
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
