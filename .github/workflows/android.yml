name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source

      - name: Injetar Suporte Extrator sem Python
        run: |
          MAIN_FILE=$(find source -name "MainActivity.kt" -print -quit)
          if [ -n "$MAIN_FILE" ]; then
            echo "A ajustar MainActivity.kt com sed..."
            
            # 1. Injeta os imports essenciais no topo do arquivo
            sed -i '0,/package /{s/package \(.*\)/package \1\n\nimport androidx.compose.foundation.verticalScroll\nimport android.content.Intent\nimport android.net.Uri/}' "$MAIN_FILE"
            
            # 2. Atualiza os textos de aviso antigos
            sed -i 's/A conversão de páginas sociais não está habilitada nesta versão inicial./Processando download via API pública.../g' "$MAIN_FILE"
            sed -i 's/Link salvo no histórico; esta URL não parece ser um arquivo direto./Redirecionando para extração de vídeo.../g' "$MAIN_FILE"
            sed -i 's/Links de páginas sociais podem não ser baixáveis diretamente./Suporte a mídias sociais ativado./g' "$MAIN_FILE"
            sed -i 's/Esta versão baixa URLs diretas de arquivos de mídia./Preparando arquivo para a galeria.../g' "$MAIN_FILE"
          fi

          # 3. Configura a compatibilidade com Java 17 no app
          BUILD_FILE=$(find source -name "build.gradle.kts" -path "*/app/*" -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            echo "A configurar Java 17 no build.gradle.kts..."
            echo "" >> "$BUILD_FILE"
            echo "android {" >> "$BUILD_FILE"
            echo "    compileOptions {" >> "$BUILD_FILE"
            echo "        sourceCompatibility = JavaVersion.VERSION_17" >> "$BUILD_FILE"
            echo "        targetCompatibility = JavaVersion.VERSION_17" >> "$BUILD_FILE"
            echo "    }" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
            echo "kotlin {" >> "$BUILD_FILE"
            echo "    compilerOptions {" >> "$BUILD_FILE"
            echo "        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17" >> "$BUILD_FILE"
            echo "    }" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
          fi

      - name: Configurar Gradle (Automático)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (Debug)
        run: |
          PROJECT_DIR=$(dirname $(find source -name "settings.gradle.kts" -print -quit))
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
