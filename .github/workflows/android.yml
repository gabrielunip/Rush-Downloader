name: Build BlueRushDownloader APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar Licenças e Instalar SDK Componentes
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto ZIP
        run: |
          mkdir -p source
          unzip -o BlueRushDownloader_project.zip -d source

      - name: Injetar Import do verticalScroll no MainActivity.kt
        run: |
          MAIN_FILE=$(find source -name "MainActivity.kt" -print -quit)
          if [ -n "$MAIN_FILE" ]; then
            echo "A adicionar o import necessário em: $MAIN_FILE"
            # Adiciona o import do verticalScroll logo abaixo do pacote
            sed -i '0,/package /{s/package \(.*\)/package \1\n\nimport androidx.compose.foundation.verticalScroll/}' "$MAIN_FILE"
          fi

      - name: Configurar Gradle (Automático)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (Debug)
        run: |
          PROJECT_DIR=$(dirname $(find source -name "settings.gradle.kts" -print -quit))
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueRushDownloader-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
